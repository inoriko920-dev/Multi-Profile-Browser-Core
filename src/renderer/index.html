<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'none'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Multi-Profile Browser Core</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #132238;
        background: #f6f8fb;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(720px, calc(100vw - 48px)); padding: 40px; background: white; border: 1px solid #dce5f2; border-radius: 16px; box-shadow: 0 18px 50px rgba(31, 65, 114, 0.08); }
      .eyebrow { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #2d6cdf; }
      h1 { margin: 0 0 12px; font-size: 32px; line-height: 1.15; }
      p { margin: 0; line-height: 1.65; color: #53657c; }
      .status { margin-top: 28px; padding: 16px 18px; border-radius: 12px; background: #eef5ff; border: 1px solid #cfe0ff; }
      .status strong { display: block; margin-bottom: 4px; color: #1f5fc4; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">STEP 00 · Foundation</p>
      <h1>Multi-Profile Browser Core</h1>
      <p>Pondasi aplikasi aktif. Pada tahap ini hanya UI lokal yang diizinkan. Belum ada remote website, login akun, multi-profile, atau AI agent.</p>
      <div class="status">
        <strong>Foundation ready</strong>
        <span>Jika jendela ini tampil, bootstrap Electron dan renderer lokal berhasil dimuat.</span>
      </div>
    </main>
  </body>
</html>
