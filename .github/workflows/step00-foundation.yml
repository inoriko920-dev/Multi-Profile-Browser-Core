name: Foundation Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Bootstrap lockfile when missing
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) {
            npm install --package-lock-only --ignore-scripts
          }

      - name: Commit generated lockfile
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          if (git status --porcelain package-lock.json) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh reproducible npm lockfile"
            git push
          }

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: STEP 00 clean-shutdown smoke test
        run: npm run smoke

      - name: STEP 01 browser-engine smoke test
        run: npm run smoke:browser

      - name: STEP 02 offline compatibility-harness smoke test
        run: npm run smoke:step02

      - name: STEP 02 safe evidence helper smoke test
        run: npm run step02:evidence:ci

      - name: STEP 02 Windows runner npm probe + dry-run
        shell: cmd
        env:
          MPBC_STEP02_RUNNER_CI: '1'
        run: RUN_STEP02_TEST.bat
